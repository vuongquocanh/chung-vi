# Đưa web Chung Ví lên GitHub Pages mỗi khi push lên nhánh main.
# Bật một lần: GitHub repo → Settings → Pages → Source: "GitHub Actions".
name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Kiểm tra thư mục web
        run: ls -la www && test -f www/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
