# Đưa web Chung Ví lên GitHub Pages mỗi khi push lên nhánh main.
# Bật một lần: GitHub repo → Settings → Pages → Source: "GitHub Actions".
name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Kiểm tra thư mục web
        run: ls -la www && test -f www/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub đôi khi chưa kịp "thấy" gói vừa tải lên → đợi rồi thử lại một lần
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
